[project]
name = "mdflux"
version = "0.1.0"
description = "Keep your markdown docs up-to-date by embedding invisible shell commands"
authors = [
    { name = "Spence Sellers", email = "spencesellers@gmail.com" }
]
dependencies = [
    "click>=8.1.7",
]
readme = "README.md"
requires-python = ">= 3.12"

[project.scripts]
mdflux = 'mdflux.__main__:cli'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mdflux"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
